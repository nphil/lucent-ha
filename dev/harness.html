<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Home Assistant's own viewport and colour-scheme tags (src/html/index.html.template), so touch emulation lays out the way the app does. -->
    <meta name="viewport" content="width=device-width, user-scalable=no, viewport-fit=cover, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>lucent-ha harness</title>
    <link rel="preload" href="/fonts/Roboto-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Roboto-500.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Home Assistant ships Roboto; the harness serves the same family from dev/fonts (SIL Open Font License). */
      @font-face { font-family: Roboto; font-weight: 400; font-style: normal; font-display: block; src: url(/fonts/Roboto-400.woff2) format("woff2"); }
      @font-face { font-family: Roboto; font-weight: 500; font-style: normal; font-display: block; src: url(/fonts/Roboto-500.woff2) format("woff2"); }
      @font-face { font-family: Roboto; font-weight: 700; font-style: normal; font-display: block; src: url(/fonts/Roboto-700.woff2) format("woff2"); }
      /* Home Assistant's page baseline (index.html.template + _style_base.html.template). */
      html { background-color: var(--primary-background-color, #fafafa); color: var(--primary-text-color, #212121); height: 100vh; }
      body { font-family: Roboto, Noto, sans-serif; -moz-osx-font-smoothing: grayscale; -webkit-font-smoothing: antialiased; font-weight: 400; margin: 0; padding: 0; height: 100%; }
    </style>
  </head>
  <body>
    <script type="module" src="/dist/harness.js"></script>
  </body>
</html>
